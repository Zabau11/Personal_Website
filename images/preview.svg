<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">David Sabau — zabau.ceo</title>
  <desc id="desc">Terminal home of David Sabau: now pane, work, and thoughts on carbon paper with olive accents.</desc>
  <defs>
